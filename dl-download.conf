server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dl.ddddkiii.com;

    ssl_certificate /etc/letsencrypt/live/dl.ddddkiii.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dl.ddddkiii.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    client_max_body_size 300m;

    location /downloads/ {
        alias /opt/matrixflow/frontend-dist/downloads/;
        autoindex off;
        tcp_nopush on;
        tcp_nodelay on;
        sendfile on;
        sendfile_max_chunk 1m;
        output_buffers 2 1m;
        add_header Cache-Control "public, max-age=3600, s-maxage=86400, stale-while-revalidate=86400";
        add_header X-Download-Source "direct-nginx";
    }

    location /companion-updates/ {
        alias /opt/matrixflow/frontend-dist/companion-updates/;
        autoindex off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = / {
        return 302 https://ddddkiii.com;
    }

    location / {
        return 404;
    }
}
