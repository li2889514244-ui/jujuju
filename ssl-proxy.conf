server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name ddddkiii.com www.ddddkiii.com _;

    ssl_certificate /etc/letsencrypt/live/ddddkiii.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ddddkiii.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 300m;

    # Serve download files directly from filesystem (bypass Docker container)
    location /downloads/ {
        alias /opt/matrixflow/frontend-dist/downloads/;
        autoindex off;
        tcp_nopush on;
        tcp_nodelay on;
        sendfile on;
        sendfile_max_chunk 1m;
        output_buffers 2 1m;
        add_header Cache-Control "public, max-age=3600, s-maxage=86400, stale-while-revalidate=86400";
        add_header X-Matrixflow-Cache-Policy "nginx-static-direct";
    }

    # Serve companion update manifest directly
    location /companion-updates/ {
        alias /opt/matrixflow/frontend-dist/companion-updates/;
        autoindex off;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Matrixflow-Cache-Policy "nginx-static-direct";
    }

    # Temporary upload proxy
    location /upload {
        proxy_pass http://127.0.0.1:9876;
        proxy_set_header Host $host;
        client_max_body_size 300m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
