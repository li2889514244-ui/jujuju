name: CI Pipeline

on:
  push:
    branches: [master, main, develop, 'feature/**']
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== Backend Lint & Type Check ====================
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        working-directory: backend
        run: npx tsc --noEmit

  # ==================== Backend Unit Tests ====================
  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: matrixflow_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Bootstrap isolated CI database from release parent schema
        working-directory: backend
        shell: bash
        run: |
          # The earliest migrations predate the PostgreSQL schema and contain
          # SQLite-era SQL. Production already records those migrations as
          # applied, so CI baselines the parent schema and validates the new
          # release migration against a fresh PostgreSQL database.
          release_migration="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -n 1)"
          migration_commit="$(git log --reverse --format='%H' --diff-filter=A -- "backend/prisma/migrations/${release_migration}/migration.sql" | head -n 1)"
          test -n "$migration_commit"
          git show "${migration_commit}^:backend/prisma/schema.prisma" > "${RUNNER_TEMP}/schema-before-release.prisma"
          npx prisma db push --schema="${RUNNER_TEMP}/schema-before-release.prisma" --skip-generate
          mapfile -t prior_migrations < <(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | grep -v "^${release_migration}$")
          for migration in "${prior_migrations[@]}"; do
            npx prisma migrate resolve --applied "$migration"
          done
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/matrixflow_test

      - name: Apply release migrations to isolated CI database
        working-directory: backend
        run: |
          npx prisma migrate deploy
          npx prisma migrate status
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/matrixflow_test

      - name: Run tests
        working-directory: backend
        run: npm run test:ci
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/matrixflow_test
          REDIS_URL: redis://localhost:6379

  # ==================== Frontend Lint & Type Check ====================
  frontend-lint:
    name: Frontend Type Check & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: Run tests
        working-directory: frontend
        run: npx vitest run

      - name: Build smoke test
        working-directory: frontend
        run: npm run build

  # ==================== Build Docker Image ====================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint]
    # Feature branches may build images for validation, but no CI job here
    # pushes an image or deploys production.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (smoke test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: matrixflow-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (smoke test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: matrixflow-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
